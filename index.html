  <body class="bg-background text-textPrimary">
    <script>
      // Reverses the 404.html redirect trick so a deep link resolves to the
      // right client-side route once the app takes over.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <div id="root"></div>
  </body>
