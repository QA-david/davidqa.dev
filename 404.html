<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>David Almeida | Senior Quality Engineer</title>
    <script>
      // GitHub Pages SPA redirect: https://github.com/rafgraph/spa-github-pages
      // Preserves the deep link (path + hash) through a query-string round trip
      // so a hard refresh or shared URL lands on the right route in the app.
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
